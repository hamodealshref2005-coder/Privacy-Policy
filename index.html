<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy | سياسة الخصوصية</title>
<meta name="description" content="Privacy Policy for the music player app / سياسة الخصوصية لتطبيق مشغل الموسيقى">
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73;
    --line:#e5e5ea; --accent:#ff2d55; --accent2:#8c52ff; --chip:#ececf0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0b12; --card:#151522; --text:#f2f2f7; --muted:#a0a0a8; --line:#262636; --chip:#222233; }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--text); line-height:1.8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  }
  header{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    padding:48px 20px 64px; text-align:center;
  }
  header h1{margin:0 0 8px; font-size:clamp(26px,5vw,38px)}
  header p{margin:0; opacity:.9}
  .lang{
    display:inline-flex; margin-top:20px; background:rgba(255,255,255,.2);
    border-radius:12px; padding:3px;
  }
  .lang button{
    border:0; background:transparent; color:#fff; padding:8px 22px; border-radius:10px;
    font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .lang button.on{background:#fff; color:#222}
  main{max-width:820px; margin:-36px auto 48px; padding:0 16px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:24px 24px; margin-bottom:16px;
  }
  .card h2{margin:0 0 10px; font-size:20px; display:flex; align-items:center; gap:10px}
  .num{
    flex:none; width:28px; height:28px; border-radius:50%; font-size:14px;
    display:inline-flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
  }
  .card p{margin:8px 0}
  .card ul{margin:8px 0; padding-inline-start:22px}
  .card li{margin:4px 0}
  a{color:var(--accent2)}
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  .chip{background:var(--chip); color:var(--muted); border-radius:999px; padding:4px 14px; font-size:13px}
  .note{
    background:var(--chip); border-radius:12px; padding:12px 16px; margin-top:10px; font-size:15px;
  }
  footer{text-align:center; color:var(--muted); font-size:13px; padding:0 16px 40px}
</style>
</head>
<body>

<header>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
  <div class="lang" role="group" aria-label="Language">
    <button id="btn-ar" type="button">العربية</button>
    <button id="btn-en" type="button">English</button>
  </div>
</header>

<main>
  <div class="meta" id="meta"></div>
  <div id="sections"></div>
</main>

<footer id="footer"></footer>

function toArabicDigits(n){ return String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]); }

function fill(str, lang){
  return str
    .replaceAll("{APP}", lang === "ar" ? CONFIG.appNameAr : CONFIG.appNameEn)
    .replaceAll("{DEV}", CONFIG.developer)
    .replaceAll("{EMAIL}", CONFIG.email);
}

function render(lang){
  const t = T[lang];
  document.documentElement.lang = t.lang;
  document.documentElement.dir = t.dir;
  document.title = t.title + " | " + (lang === "ar" ? CONFIG.appNameAr : CONFIG.appNameEn);
  document.getElementById("title").textContent = t.title;
  document.getElementById("subtitle").textContent = fill(t.subtitle, lang);
  document.getElementById("meta").innerHTML =
    '<span class="chip">' + t.updated + CONFIG.updated[lang] + '</span>' +
    '<span class="chip">' + t.developer + CONFIG.developer + '</span>';
  document.getElementById("footer").textContent = fill(t.footer, lang);

  const box = document.getElementById("sections");
  box.innerHTML = "";
  t.sections.forEach(function(s, i){
    const card = document.createElement("section");
    card.className = "card";
    const n = lang === "ar" ? toArabicDigits(i + 1) : (i + 1);
    card.innerHTML = '<h2><span class="num">' + n + '</span>' + s[0] + '</h2>' + fill(s[1], lang);
    box.appendChild(card);
  });

  document.getElementById("btn-ar").classList.toggle("on", lang === "ar");
  document.getElementById("btn-en").classList.toggle("on", lang === "en");
  try { localStorage.setItem("pp-lang", lang); } catch (e) {}
}

(function init(){
  let lang = "";
  try { lang = localStorage.getItem("pp-lang") || ""; } catch (e) {}
  if (lang !== "ar" && lang !== "en") {
    lang = (navigator.language || "en").toLowerCase().startsWith("ar") ? "ar" : "en";
  }
  document.getElementById("btn-ar").addEventListener("click", function(){ render("ar"); });
  document.getElementById("btn-en").addEventListener("click", function(){ render("en"); });
  render(lang);
})();
</script>

</html>
